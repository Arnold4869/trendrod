version: '3.8'

services:
  trendrod:
    image: registry.cn-hangzhou.aliyuncs.com/docker-pusher/trendrod:0.1.9
    container_name: trendrod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
