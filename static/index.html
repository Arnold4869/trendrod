<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TrendRod — 指数动量轮动</title>
  <script src="/static/chart.umd.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root, [data-theme="light-blue"] {
      --bg: #f0f4f8; --card: #ffffff; --card-hover: #e8eef4;
      --up: #cc2200; --up-dim: rgba(204,34,0,0.10);   /* 红涨 */
      --down: #4ade80; --down-dim: rgba(74,222,128,0.10); /* 绿跌 (light-blue 特殊: 蓝绿) */
      --accent: #0066cc; --accent-dim: rgba(0,102,204,0.10); /* 品牌强调 (light-blue 用品牌蓝) */
      --dd-zone: rgba(204,34,0,0.08); /* 回撤区底色, 永远偏红 */
      --orange: #e67e22;
      --text: #1a202c; --text-dim: #4a5568; --text-muted: #a0aec0;
      --border: #d0dce8; --radius: 12px; --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    [data-theme="warm"] {
      --bg: #f5f0e8; --card: #fffdf8; --card-hover: #f0ebe0;
      --up: #c0392b; --up-dim: rgba(192,57,43,0.12);
      --down: #2d7a4f; --down-dim: rgba(45,122,79,0.12);
      --accent: #2d7a4f; --accent-dim: rgba(45,122,79,0.12); /* warm 用绿系做强调 */
      --dd-zone: rgba(192,57,43,0.08);
      --orange: #d35400;
      --text: #2c2416; --text-dim: #6b5c4a; --text-muted: #b0a090;
      --border: #ddd0c0; --radius: 12px; --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    [data-theme="dark-gray"] {
      --bg: #1a1a1a; --card: #252525; --card-hover: #2d2d2d;
      --up: #f87171; --up-dim: rgba(248,113,113,0.12);
      --down: #4ade80; --down-dim: rgba(74,222,128,0.12);
      --accent: #4ade80; --accent-dim: rgba(74,222,128,0.12);
      --dd-zone: rgba(248,113,113,0.10);
      --orange: #fb923c;
      --text: #e5e5e5; --text-dim: #a0a0a0; --text-muted: #666666;
      --border: #333333; --radius: 12px; --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    [data-theme="starry"] {
      --bg: #0a0a1a; --card: #12122a; --card-hover: #1a1a3a;
      --up: #ff4757; --up-dim: rgba(255,71,87,0.10);
      --down: #00e5a0; --down-dim: rgba(0,229,160,0.10);
      --accent: #60a5fa; --accent-dim: rgba(96,165,250,0.12);
      --dd-zone: rgba(255,71,87,0.06);
      --orange: #fbbf24;
      --text: #e0e7ff; --text-dim: #8090b0; --text-muted: #5060a0;
      --border: #1e2040; --radius: 12px; --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body { height:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: var(--safe-bottom);
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .update-time { font-size: 11px; color: var(--text-dim); }
    .btn-refresh {
      background: var(--card); border: none; border-radius: 8px;
      color: var(--text); font-size: 18px; width: 36px; height: 36px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .btn-refresh:active { transform: scale(0.9); }
    .btn-refresh.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .container { max-width: 800px; margin: 0 auto; padding: 12px 14px 80px; }

    .loading-overlay { text-align: center; padding: 60px 0; color: var(--text-dim); }
    .spinner-big {
      width: 36px; height: 36px; margin: 0 auto 12px;
      border: 3px solid var(--text-muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    /* 组合选择器 */
    .pf-bar-wrap { display: flex; align-items: center; border-bottom: 1px solid var(--border); padding: 6px 14px; gap: 4px; }
    .pf-bar {
      display: flex; gap: 6px; overflow-x: auto; padding: 4px 0;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; flex: 1; align-items: center;
    }
    .pf-gear { background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 8px;border-radius:6px;flex-shrink:0; }
.pf-gear:hover { background:var(--card);color:var(--text); }

.pf-bar::-webkit-scrollbar { display: none; }
    .pf-tab {
      flex-shrink: 0; padding: 5px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      background: var(--card); color: var(--text-dim);
      border: 1px solid var(--border); white-space: nowrap;
      transition: all 0.15s;
    }
    .pf-tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .pf-tab.add { border-style: dashed; color: var(--text-muted); font-size: 16px; padding: 5px 12px; }

    /* 标的标签栏 + 搜索同行 */
    .pool-bar-row { display: flex; align-items: center; gap: 6px; padding: 4px 14px; border-bottom: 1px solid var(--border); }
    .pool-bar { display: flex; gap: 6px; overflow-x: auto; flex: 1; padding: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }

/* 标的标签栏 */
    .pool-chip {
      flex-shrink: 0; padding: 4px 12px; border-radius: 14px;
      font-size: 12px; font-weight: 500; cursor: default;
      background: var(--card); color: var(--text-dim);
      border: 1px solid var(--border);
      display: flex; align-items: center; gap: 5px;
      max-width: 120px; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis;
    }
    .pool-chip .chip-x { font-size: 10px; opacity: 0.4; cursor: pointer; }
    .pool-chip .chip-x:hover { opacity: 1; color: var(--up); }
    .pool-chip.add { border-style: dashed; cursor: pointer; color: var(--text-muted); }

    /* 周期 + 搜索行 */
    .ctl-row {
      display: flex; gap: 8px; padding: 6px 14px; align-items: center;
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .ctl-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    .theme-switcher { display: flex; gap: 4px; align-items: center; margin-left: 12px; }
    .theme-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 4px 7px; line-height: 1; transition: all 0.15s; }
    .theme-btn:hover { background: var(--card-hover); color: var(--text); }
    [data-theme="light-blue"] .theme-btn[onclick*="light-blue"],
    [data-theme="warm"] .theme-btn[onclick*="warm"],
    [data-theme="dark-gray"] .theme-btn[onclick*="dark-gray"],
    [data-theme="starry"] .theme-btn[onclick*="starry"] { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .ctl-input {
      width: 56px; padding: 5px 8px; font-size: 13px; text-align: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
    }
    .ctl-input:focus { border-color: var(--accent); }
    .ctl-input-weight {
      width: 44px; padding: 5px 4px; font-size: 12px; text-align: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
    }
    .ctl-input-weight:focus { border-color: var(--orange); }
    .ctl-btn {
      background: var(--accent); border: none; border-radius: 6px;
      color: var(--bg); font-size: 12px; font-weight: 600;
      padding: 5px 12px; cursor: pointer; white-space: nowrap;
    }
    .ctl-btn:disabled { opacity: 0.5; }
    .ctl-del {
      background: none; border: 1px solid var(--up); border-radius: 6px;
      color: var(--up); font-size: 11px; padding: 4px 10px; cursor: pointer;
      margin-left: auto; white-space: nowrap;
    }
    .search-wrap { position: relative; flex: 0 0 120px; width: 120px; }
    .search-input {
      width: 100%; padding: 4px 8px; font-size: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-drop {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; max-height: 180px; overflow-y: auto; display: none;
    }
    .search-drop.show { display: block; }
    .search-item {
      padding: 8px 10px; font-size: 12px; cursor: pointer;
      display: flex; justify-content: space-between; border-bottom: 1px solid var(--border);
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: var(--card-hover); }
    .search-item .si-sym { color: var(--text-dim); }
    .search-item .si-name { color: var(--text); }

    #holdingArea { padding: 6px 14px; border-bottom: 1px solid var(--border); background: var(--card); min-height: 0; }
    .msg-bar {
      display: none; text-align: center; font-size: 12px; padding: 6px 14px;
    }

    /* 指标卡 */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card {
      background: var(--card); border-radius: var(--radius); padding: 14px 16px;
      position: relative; overflow: hidden;
    }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.return::before { background: var(--accent); }
    .stat-card.annual::before { background: var(--orange); }
    .stat-card.drawdown::before { background: var(--up); }
    .stat-card.sharpe::before { background: #6c5ce7; }
    .stat-card.calmar::before { background: #00d2ff; }
    .stat-card.winrate::before { background: #ffa502; }
    .stat-card.rotations::before { background: #a29bfe; }
    .stat-card.trading::before { background: #636e72; }
    .stat-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .stat-value.up { color: var(--up); }
    .stat-value.down { color: var(--down); }

    .section { margin-bottom: 14px; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }

    /* 日期区间选择器 */
    .date-bar {
      display: flex; gap: 6px; padding: 4px 0 8px;
      -webkit-overflow-scrolling: touch; align-items: center;
      position: relative; overflow: visible;
    }
    .date-bar::-webkit-scrollbar { display: none; }
    .date-bar-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .date-label { font-size: 11px; color: var(--text-dim); margin-right: 4px; flex-shrink: 0; }
    .date-tab {
      flex-shrink: 0; padding: 4px 10px; border-radius: 14px;
      font-size: 11px; cursor: pointer; white-space: nowrap;
      background: var(--card); color: var(--text-dim);
      border: 1px solid var(--border); transition: all 0.15s;
    }
    .date-tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .date-tab.all { font-weight: 600; }
    .date-tab.specials-toggle { color: var(--text-muted); border-style: dashed; }
    .date-tab.preset-tab { font-size: 10px; padding: 3px 8px; }
    .presets-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      background: #1e2130;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 1000;
      min-width: 140px;
      padding: 6px 0;
    }
    .presets-dropdown.hidden { display: none; }
    .presets-dropdown .preset-item {
      display: block;
      padding: 8px 14px;
      font-size: 12px;
      color: #a8b1c2;
      cursor: pointer;
      border-radius: 4px;
      margin: 2px 6px;
      white-space: nowrap;
    }
    .presets-dropdown .preset-item:hover { background: rgba(255,255,255,0.08); color: #e8eaf0; }
    .presets-dropdown .preset-item.active { color: #00e5a0; font-weight: 600; }
    .date-input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; color: var(--text); font-size: 11px;
      padding: 4px 8px; outline: none; flex-shrink: 0;
      width: 120px; font-family: inherit;
    }
    .date-input:focus { border-color: var(--accent); }
    .date-input::-webkit-calendar-picker-indicator { filter: invert(0.7); }
    .interval-badge {
      font-size: 10px; color: var(--orange); margin-left: 8px;
      background: rgba(255,165,2,0.1); padding: 2px 8px; border-radius: 8px;
      display: none;
    }
    .interval-badge.show { display: inline; }

    .chart-card { background: #1a2c38; border-radius: var(--radius); padding: 12px; border: 1px solid rgba(36,59,71,0.4); }
    .chart-wrap { height: 260px; position: relative; }
    .chart-wrap canvas { width: 100% !important; }

    .holding-card {
      background: var(--card); border-radius: var(--radius); padding: 12px;
      display: flex; align-items: center; gap: 16px;
    }
    .holding-tag {
      width: 2.8rem; height: 2.8rem; border-radius: 0.6rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.54rem; font-weight: 700; flex-shrink: 0;
      background: var(--accent-dim); color: var(--accent);
    }
    .holding-tag.empty { background: rgba(230,126,34,0.15); color: var(--orange); }
    .holding-tag.up { background: var(--up-dim); color: var(--up); }
    .holding-tag.down { background: var(--down-dim); color: var(--down); }
    .holding-info { flex: 1; min-width: 0; }
    .holding-name { font-size: 13px; font-weight: 600; }
    .holding-meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    .holding-pnl { text-align: right; flex-shrink: 0; }
    .holding-pnl-val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .holding-pnl-val.up { color: var(--up); }
    .holding-pnl-val.down { color: var(--down); }
    .holding-pnl-label { font-size: 10px; color: var(--text-dim); }

    .rot-item {
      background: var(--card); border-radius: var(--radius-sm); padding: 12px 14px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px;
    }
    .rot-date { color: var(--text-dim); font-size: 11px; min-width: 80px; }
    .rot-badge {
      padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
      min-width: 52px; text-align: center;
    }
    .rot-badge.buy { background: #d4ecf7; color: #000; }
    .rot-badge.sell { background: var(--up-dim); color: #000; }
    .rot-name {
      font-weight: 500; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rot-pnl { font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .rot-pnl.up { color: var(--up); }
    .rot-pnl.down { color: var(--down); }
    .empty-state { text-align: center; padding: 30px; color: var(--text-dim); font-size: 13px; }

    /* Skeleton loading */
    .skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sk-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .sk-card { height: 72px; }
    .sk-chart { height: 260px; margin-bottom: 14px; }
    .sk-hold { height: 64px; margin-bottom: 14px; }
    .sk-rot { height: 220px; }
    @media (min-width: 768px) { .sk-stats { grid-template-columns: repeat(4, 1fr); } .sk-chart { height: 320px; } }

    /* Yearly returns */
    .yearly-section { margin-bottom: 14px; }
    .yearly-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
    .yearly-label { min-width: 38px; color: var(--text-dim); font-size: 12px; }
    .yearly-bar-wrap { flex: 1; height: 22px; background: var(--bg); border-radius: 6px; overflow: hidden; position: relative; }
    .yearly-bar { height: 100%; border-radius: 6px; min-width: 3px; transition: width 0.6s ease; }
    .yearly-bar.up { background: var(--up); }
    .yearly-bar.down { background: var(--down); }
    .yearly-val { min-width: 52px; text-align: right; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
    .yearly-val.up { color: var(--up); }
    .yearly-val.down { color: var(--down); }

    /* ── 定时刷新 ── */
    .sch-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 6px 0; font-size: 12px;
    }
    .sch-label { color: var(--text-dim); white-space: nowrap; }
    .sch-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 14px;
      padding: 2px 10px; font-size: 12px; font-weight: 500;
    }
    .sch-chip-del {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 0; opacity: 0.7;
    }
    .sch-chip-del:hover { opacity: 1; }
    .sch-input { width: 64px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; outline: none; }
    .sch-input:focus { border-color: var(--accent); }
    .sch-add-btn {
      padding: 3px 10px; border-radius: 6px; border: 1px solid var(--accent);
      background: var(--accent-dim); color: var(--accent); font-size: 12px; cursor: pointer;
    }
    .sch-add-btn:hover { background: rgba(0,229,160,0.18); }
    .sch-log-btn {
      margin-left: auto; padding: 3px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: none; color: var(--text-dim);
      font-size: 12px; cursor: pointer;
    }
    .sch-log-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sch-log-area {
      display: none; font-size: 11px; color: var(--text-dim);
      background: var(--bg); border-radius: 6px; padding: 8px;
      max-height: 120px; overflow-y: auto; margin-top: 4px;
    }
    .sch-log-area.show { display: block; }
    .log-item { padding: 2px 0; border-bottom: 1px solid var(--border); }
    .log-item:last-child { border-bottom: none; }
    .log-ok { color: var(--accent); }
    .log-fail { color: var(--up); }

    /* Holding days in rotation */
    .rot-card-grid {
      display: flex; flex-direction: column; gap: 0;
      width: 100%;
    }
    .rot-card {
      background: var(--card); border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 4px;
      border-left: 3px solid transparent;
    }
    .rot-card.up { border-left-color: var(--up); }
    .rot-card.down { border-left-color: var(--down); }
    .rot-card-date { font-size: 11px; color: var(--text-dim); }
    .rot-card-held { font-size: 14px; color: var(--text); font-weight: 600; }
    .rot-card-pnl { font-size: 16px; font-weight: 700; margin-top: 2px; }
    .rot-card-pnl.up { color: var(--up); }
    .rot-card-pnl.down { color: var(--down); }
    .rot-card-pnl { color: var(--text-dim); }
    /* M25: 轮动历史"显示更多"按钮 */
    .rot-show-more {
      margin-top: 10px; padding: 10px 12px; text-align: center;
      font-size: 12px; color: var(--accent); cursor: pointer;
      background: var(--accent-dim); border: 1px solid var(--border);
      border-radius: var(--radius-sm); transition: background .15s;
    }
    .rot-show-more:hover { background: rgba(96,165,250,0.22); }
    /* 调仓连接器：垂直方向在卡片之间 */
    .rot-adj {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 0 4px;
    }
    .rot-adj-label {
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; text-align: center; line-height: 1.4;
      margin-bottom: 4px;
    }
    .rot-adj-arrow-wrap {
      display: flex; flex-direction: column; align-items: center;
    }
    .rot-adj-arrow-line {
      width: 1px; height: 12px;
      background: var(--border);
    }
    .rot-adj-arrow-head {
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid var(--text-dim);
    }
    .rot-adj-sell { color: var(--accent); }
    .rot-adj-buy { color: var(--up); }

    /* ── Toast (P2-M24) ── */
    #toastHost {
      position: fixed; top: 20px; right: 20px; left: auto;
      z-index: 10000;

<script>
function setTheme(name) {

<script>
// 全局错误捕获
window.onerror = function(msg, url, line, col, err) {
  var el = document.getElementById('loading');
  if (el) el.innerHTML = '<div style="color:#ff4757;padding:20px;text-align:center;font-size:13px">JS错误: ' + msg + '<br><small>行 ' + line + '</small></div>';
};

// 集中式事件委托（C6: 防御 XSS — 替换分散在各处的 onclick/oninput/onchange/onblur）
// 在 HTML 里用 data-action / data-input-action / data-change-action / data-blur-action
// 声明要调用的 window 全局函数名，通过单个 document 监听器统一派发，避免内联 JS。
function _jsDelegate(dataAttr, evtName) {
  document.addEventListener(evtName, function(e) {
    var t = e.target.closest('[' + dataAttr + ']');
    if (!t) return;
    var fn = window[t.getAttribute(dataAttr)];
    if (typeof fn !== 'function') return;
    fn(t.getAttribute('data-id'), e, t);
  });
}
_jsDelegate('data-action', 'click');
_jsDelegate('data-input-action', 'input');
_jsDelegate('data-change-action', 'change');
_jsDelegate('data-blur-action', 'blur');

// onkeydown 特例：.js-rename-input 上 Enter→blur, Escape→cancel（与原行为一致）
document.addEventListener('keydown', function(e) {
  var t = e.target.closest && e.target.closest('.js-rename-input');
  if (!t) return;
  if (e.key === 'Enter') t.blur();
  else if (e.key === 'Escape') { try { t.cancel(); } catch (_) {} }
});

// 包装：复合操作（多个原 inline handler 合并为一个函数）
function focusSearchInput() { document.getElementById('searchInput').focus(); }
function viewPf(id) { switchTo(id); togglePfDrawer(); }
function stopAndRemoveIndex(sym, event) {
  if (event && event.stopPropagation) event.stopPropagation();
  removeIndex(sym);
}
let navChart = null;
let activePf = 'default';
let portfolios = [];
let searchTimer = null;
let searchAbortCtrl = null; // M29: 搜索 AbortController，发起新搜索时 abort 上一次 in-flight 请求
let filteredRot = [];
// M25: 轮动历史分页——默认展示最近 ROTATION_DEFAULT_LIMIT 条，点击"显示更多"展开全部
var ROTATION_DEFAULT_LIMIT = 60;
let rotationShowAll = false;
let currentHolding = null;
let chartMode = 'nav'; // 'nav' or 'return'
let activeBench = '';  // benchmark symbol
let benchNavData = null;
let benchSym = '';

// ─── HTML 转义（C5: 防御 XSS） ──────────────────
// 把用户控制的字符串安全地嵌入 HTML。所有 renderXxx 函数在拼接 innerHTML 前
// 必须先调用本函数包装 name / id / sym 等字段。null/undefined → 空串。
function escHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function pctClass(v) { return v > 0 ? 'up' : 'down'; }

// Count-up animation
function animateValue(el, start, end, duration, formatter) {
  if (!formatter) formatter = function(v) { return v.toFixed(1) + '%'; };
  var startTime = null;
  function step(timestamp) {
    if (!startTime) startTime = timestamp;
    var progress = Math.min((timestamp - startTime) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3); // ease-out
    var current = start + (end - start) * eased;
    el.textContent = formatter(current);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ─── Toast (P2-M24) ──────────────────────────────
// 轻量级浮动提示: toast('保存成功', 'success') 或 toast('出错了', 'error', 5000)
// type: success / error / warn / info (默认 info)
function toast(msg, type, duration) {
  duration = duration || 3000;
  type = type || 'info';
  var host = document.getElementById('toastHost');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toastHost';
    document.body.appendChild(host);
  }
  var t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;  // 不用 innerHTML 防 XSS
  host.appendChild(t);
  setTimeout(function() { t.classList.add('toast-out'); }, Math.max(0, duration - 200));
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, duration);
}

// ─── Dialog (P2-M24) ────────────────────────────
// 轻量级模态对话框: dialog({ title, content, input, inputPlaceholder, confirmText, cancelText, danger, onConfirm(value) })
// ESC 关闭, 点击 backdrop 关闭 (danger 操作除外)
function dialog(opts) {
  opts = opts || {};
  var d = document.createElement('div');
  d.className = 'dialog-backdrop';
  var html = '<div class="dialog" role="dialog" aria-modal="true">';
  html += '<div class="dialog-title">' + escHtml(opts.title || '') + '</div>';
  if (opts.content) html += '<div class="dialog-content">' + escHtml(opts.content) + '</div>';
  if (opts.input) html += '<input class="dialog-input" placeholder="' + escHtml(opts.inputPlaceholder || '') + '">';
  html += '<div class="dialog-actions">';
  html += '<button class="dialog-btn dialog-cancel" data-action="cancel">' + escHtml(opts.cancelText || '取消') + '</button>';
  html += '<button class="dialog-btn dialog-confirm' + (opts.danger ? ' danger' : '') + '" data-action="confirm">' + escHtml(opts.confirmText || '确认') + '</button>';
  html += '</div></div>';
  d.innerHTML = html;
  document.body.appendChild(d);
  var input = d.querySelector('.dialog-input');
  if (input) { setTimeout(function() { input.focus(); }, 30); }
  function close(result, value) {
    d.classList.add('dialog-out');
    setTimeout(function() { if (d.parentNode) d.parentNode.removeChild(d); document.removeEventListener('keydown', onKey); }, 150);
    if (result && typeof opts.onConfirm === 'function') opts.onConfirm(value);
  }
  function onKey(e) { if (e.key === 'Escape') close(false); }
  document.addEventListener('keydown', onKey);
  d.querySelector('[data-action="cancel"]').addEventListener('click', function() { close(false); });
  d.querySelector('[data-action="confirm"]').addEventListener('click', function() { close(true, input ? input.value : null); });
  if (input) {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); close(true, input.value); }
    });
  }
  if (!opts.danger) {
    d.addEventListener('click', function(e) { if (e.target === d) close(false); });
  }
  // 危险对话框: 点 backdrop 不关 (但仍要 swallow click, 防止穿透)
  if (opts.danger) {
    d.addEventListener('click', function(e) { e.stopPropagation(); });
  }
}

// ─── 消息提示 (P2-M24: 内部走 toast) ──────────────────────────────
function showMsg(text, color) {
  var type = color === 'red' ? 'error' : (color === 'green' ? 'success' : 'info');
  toast(text, type);
}

// ─── 组合管理 ──────────────────────────────
async function loadPortfolios() {
  try {
    var r = await fetch('/api/portfolios?_=' + Date.now(), { cache: 'no-store' });
    var d = await r.json();
    portfolios = d.portfolios || [];
    if (!portfolios.length) {
      // 创建默认
      await fetch('/api/portfolios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: 'default', name: '默认组合', window: 22, indices: [], top_n: 1, weight_ratios: [1.0] })
      });
      return loadPortfolios();
    }
    renderPfBar();
    if (!portfolios.find(function(p) { return p.id === activePf; })) {
      activePf = portfolios[0].id;

// 实时显示权重之和
function updateWSum() {
  var w5 = parseFloat(document.getElementById('w5Input').value) || 0;
  var w22 = parseFloat(document.getElementById('w22Input').value) || 0;
  var w60 = parseFloat(document.getElementById('w60Input').value) || 0;
  var total = w5 + w22 + w60;
  var el = document.getElementById('wSum');
  el.textContent = '=' + total.toFixed(1);
  el.style.color = Math.abs(total - 1) < 0.01 ? 'var(--accent)' : 'var(--up)';
  var topN = parseInt(document.getElementById('topNInput').value) || 1;
  var wrIds = ['wr1Input','wr2Input','wr3Input','wr4Input','wr5Input'];
  for (var i = 0; i < wrIds.length; i++) {
    var el2 = document.getElementById(wrIds[i]);
    if (el2) el2.style.display = i < topN ? '' : 'none';
  }
  updateWRSum();
}

function updateWRSum() {
  var topN = parseInt(document.getElementById('topNInput').value) || 1;
  var wrIds = ['wr1Input','wr2Input','wr3Input','wr4Input','wr5Input'];
  var total = 0;
  for (var i = 0; i < topN; i++) {
    total += parseFloat(document.getElementById(wrIds[i]).value) || 0;
  }
  var el = document.getElementById('wrSum');
  if (el) {
    if (topN <= 1) { el.textContent = ''; }
    else if (Math.abs(total - 100) < 1) { el.textContent = ''; el.style.color = 'var(--accent)'; }
    else { el.textContent = total + '%≠100'; el.style.color = 'var(--up)'; }
  }
}

async function saveParams() {
  var w5 = parseFloat(document.getElementById('w5Input').value) || 0;
  var w22 = parseFloat(document.getElementById('w22Input').value) || 0;
  var w60 = parseFloat(document.getElementById('w60Input').value) || 0;
  var total = w5 + w22 + w60;
  if (Math.abs(total - 1) > 0.01) {
    showMsg('权重之和必须等于1.0（当前=' + total.toFixed(2) + '）', 'red');
    return;
  }
  var ma = parseInt(document.getElementById('maInput').value);
  var hold = parseInt(document.getElementById('holdInput').value);
  var stop = parseInt(document.getElementById('stopInput').value);
  var topN = parseInt(document.getElementById('topNInput').value) || 1;
  if (isNaN(ma)) ma = 60; if (isNaN(hold)) hold = 5; if (isNaN(stop)) stop = 0;
  if (ma < 0) ma = 0; if (ma > 250) ma = 250;
  if (hold < 0) hold = 0; if (hold > 60) hold = 60;
  if (stop < 0) stop = 0; if (stop > 50) stop = 50;
  var wrIds = ['wr1Input','wr2Input','wr3Input','wr4Input','wr5Input'];
  var weight_ratios = [];
  for (var i = 0; i < topN; i++) {
    weight_ratios.push((parseFloat(document.getElementById(wrIds[i]).value) || 0) / 100);
  }
  if (topN > 1) {
    var wrTotal = weight_ratios.reduce(function(a,b){return a+b;}, 0);
    if (Math.abs(wrTotal - 1.0) > 0.01) {
      showMsg('仓位比例和必须=100%（当前=' + Math.round(wrTotal*100) + '%）', 'red');
      return;
    }
  }
  try {
    var r = await fetch('/api/portfolios/' + encodeURIComponent(activePf), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mom_weights: [w5, w22, w60], top_n: topN, weight_ratios: weight_ratios, ma_period: ma, min_hold_days: hold, stop_loss: stop })
    });
    var d = await r.json();
    if (!d.ok) { showMsg(d.message, 'red'); return; }
    showMsg('已更新: 前N=' + topN + ' 动量=' + w5 + '/' + w22 + '/' + w60 + ' 均线=' + (ma || '关') + ' 持期=' + hold + '天 止损=' + (stop || '关') + '%', 'green');
    loadStatus();
  } catch (e) { showMsg('更新失败', 'red'); }
}

var dragSrcId = null;
function onPfDragStart(e) {
  dragSrcId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onPfDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var el = e.currentTarget;
  if (el.dataset.id !== dragSrcId) el.classList.add('drag-over');
}
function onPfDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
async function onPfDrop(e) {
  e.preventDefault();
  var el = e.currentTarget;
  el.classList.remove('drag-over');
  var tgtId = el.dataset.id;
  if (dragSrcId === tgtId) return;
  var srcIdx = portfolios.findIndex(function(p){return p.id===dragSrcId;});
  var tgtIdx = portfolios.findIndex(function(p){return p.id===tgtId;});
  var item = portfolios.splice(srcIdx, 1)[0];
  portfolios.splice(tgtIdx, 0, item);
  renderPfDrawer();
  // 保存顺序到后端
  var order = portfolios.map(function(p){return p.id;});
  await fetch('/api/portfolios/reorder', {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({order: order})
  });
  renderPfBar();
}
function onPfDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  dragSrcId = null;
}

document.getElementById('searchInput').addEventListener('input', function() {

async function doSearch(q) {
  // M29: 取消上一次 in-flight 搜索请求，避免慢网下旧结果返回覆盖新结果
  if (searchAbortCtrl) {
    try { searchAbortCtrl.abort(); } catch (_) {}
  }
  searchAbortCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var signal = searchAbortCtrl ? searchAbortCtrl.signal : undefined;
  try {
    var r = await fetch('/api/search_indices?q=' + encodeURIComponent(q), { signal: signal });
    var d = await r.json();
    var results = d.results || [];
    var drop = document.getElementById('searchDrop');
    if (!results.length) {
      drop.innerHTML = '<div class="search-item"><span class="si-name" style="color:var(--text-dim)">无结果，可直接输入代码添加</span></div>';
    } else {
      drop.innerHTML = results.map(function(item) {
        return '<div class="search-item" data-sym="' + escHtml(item.sym) + '" data-name="' + escHtml(item.name) + '" data-action="addIndex">' +
          '<span class="si-name">' + item.name + '</span>' +
          '<span class="si-sym">' + item.sym + '</span></div>';
      }).join('');
    }
    drop.classList.add('show');
  } catch (e) {
    // M29: 主动 abort 引发的 AbortError 静默忽略；其它错误也静默（与原行为一致）
    if (e && e.name === 'AbortError') return;
  }
}

// 日期格式化为 YYYY-MM-DD (本地时间, 避免 toISOString UTC 偏移)
function dateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

// 解析区间 (含 shortcut '#1m' 等) 到 cutoff 日期字符串; range='all' 返回 null
function resolveCutoff(range, nav) {
  if (range === 'all' || !range) return null;
  if (range === '#3m' || range === '#1m' || range === '#1w') {
    var last = nav.length ? nav[nav.length - 1].date : null;
    if (!last) return null;
    var d = new Date(last);
    if (range === '#3m') d.setMonth(d.getMonth() - 3);
    else if (range === '#1m') d.setMonth(d.getMonth() - 1);
    else if (range === '#1w') d.setDate(d.getDate() - 7);
    return dateStr(d);
  }
  return range; // 已是 YYYY-MM-DD
}

  var bar = document.getElementById('dateBar');

  var html = '<div class="date-bar-row">' +

    '<span class="date-tab' + (activeDateRange === '#3m' ? ' active' : '') + '" data-id="#3m" data-action="setDateRange">近3月</span>';
  if (lastDate && lastDate >= '2026-01-01') {

}

function togglePresets(e) {
  e.stopPropagation();
  var dd = document.getElementById('presetsDropdown');
  if (!dd) return;
  var wasHidden = dd.classList.contains('hidden');
  dd.classList.toggle('hidden');
  if (wasHidden) {
    document.addEventListener('click', closePresetsDropdown, { once: true });
  }
}
function closePresetsDropdown(e) {
  var dd = document.getElementById('presetsDropdown');
  if (dd && !dd.contains(e.target)) dd.classList.add('hidden');
}

function onDatePick() {
  var v = document.getElementById('datePicker').value;
  if (v) {
    setDateRange(v);
    // 取消所有 tab 的 active
    var tabs = document.querySelectorAll('.date-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  }
}

function setDateRange(range) {
  activeDateRange = range;
  buildDateBar(fullNavData);
  filterAndRender(range);
  renderBenchDisplay();
}

function filterAndRender(range) {

    nav = nav.filter(function(p) { return p.date >= cutoff; });

  var days = nav.length;
  var yrs = days / 252;
  var ar = yrs > 0 ? (Math.pow(1 + tr / 100, 1 / yrs) - 1) * 100 : 0;
  var peakVal = nav[0].value;
  var peakDate = nav[0].date;
  var mdd = 0;
  var mddStart = nav[0].date;
  var mddEnd = nav[0].date;

    if (nav[i].value > peakVal) {

      peakDate = nav[i].date;

            '<div class="holding-meta">' + (hld.entry_date || '') + ' 入场 | ' + holdDays + '天 | 动量 ' + (hld.momentum_latest || 0).toFixed(1) + '%</div>' +
          '</div>' +
          '<div class="holding-pnl">' +
            '<div class="holding-pnl-val ' + pnlClass + '">' + fmtPct(hld.period_return_pct) + '</div>' +
            '<div class="holding-pnl-label">持仓收益</div>' +
          '</div>' +
        '</div>';
      }
    } else if (range !== 'all') {
      holdingHtml = '<div class="holding-card"><div class="holding-tag empty">-</div><div class="holding-info"><div class="holding-name">已筛选区间</div><div class="holding-meta">选择"全部"查看当前持仓</div></div></div>';
    } else {
      holdingHtml = '<div class="holding-card"><div class="holding-tag empty">空</div><div class="holding-info"><div class="holding-name">空仓</div><div class="holding-meta">等待动量信号</div></div></div>';
    }
    document.getElementById('holdingArea').innerHTML = holdingHtml;
  renderRotationHistory();
}
function toggleChartMode() {
  chartMode = chartMode === 'nav' ? 'return' : 'nav';
  var btn = document.getElementById('chartToggle');
  var title = document.querySelector('.section-title');
  if (chartMode === 'return') {
    btn.textContent = '切换净值';
    if (title) title.childNodes[0].textContent = '收益率曲线 ';
  } else {
    btn.textContent = '切换收益率';
    if (title) title.childNodes[0].textContent = '净值曲线 ';
  }
  filterAndRender(activeDateRange);
}

function renderAll(data) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  // Animate stat values
  var statVals = document.querySelectorAll('.stat-value');
  statVals.forEach(function(el) {
    var txt = el.textContent;
    var num = parseFloat(txt);
    if (!isNaN(num)) {
      var orig = el.textContent;
      animateValue(el, 0, num, 600, function(v) { return orig.replace(/[\d.-]+/, v.toFixed(orig.indexOf('%') >= 0 ? 1 : 2)); });
    }
  });
  fullNavData = data.nav || [];
  fullRotData = data.rotation_log || [];
  currentHolding = data.current_holding || null;
  benchNavData = data.benchmark || null;
  benchSym = data.benchmark_sym || '';
  buildDateBar(fullNavData);
  filterAndRender(activeDateRange);
  renderBenchDisplay();
  document.getElementById('updateTime').textContent = '更新: ' + (data.last_update || '--');
}

function renderBenchDisplay() {
  var el = document.getElementById('benchReturnDisplay');
  if (!el) return;
  if (!benchNavData || benchNavData.length === 0) {
    el.textContent = '';
    return;
  }
  // Use the same date range as the chart (H21: 复用 resolveCutoff 解析 shortcut)
  var nav = fullNavData;
  var cutoff = resolveCutoff(activeDateRange, nav);
  if (cutoff !== null) {
    nav = nav.filter(function(p) { return p.date >= cutoff; });
  }
  if (!nav || nav.length === 0) {
    el.textContent = '';
    return;
  }
  var rangeStart = nav[0].date;
  var benchFiltered = benchNavData.filter(function(p) { return p.date >= rangeStart; });
  if (benchFiltered.length < 2) {
    el.textContent = '';
    return;
  }
  var bFirst = benchFiltered[0].value;
  var bLast = benchFiltered[benchFiltered.length - 1].value;
  var bRet = (bLast / bFirst - 1) * 100;
  var cls = bRet >= 0 ? 'up' : 'down';
  el.innerHTML = '<span class="' + cls + '" style="font-weight:600">' + fmtPct(bRet) + '</span>';
}

function renderRotationHistory() {
  var rot = filteredRot.length || activeDateRange !== 'all' ? filteredRot : fullRotData;
  // 迭代从新到旧，每次处理一对（买→卖），配对成一轮
  var cards = [];
  var i = rot.length - 1;
  // M25: 去掉前端硬编码 60 条上限，先构建全部轮动卡片，再用 rotationShowAll 控制展示数量
  while (i >= 0) {
    var sell = rot[i];
    // 跳过同一天先卖后买的买入行（不显示）
    if (i > 0 && rot[i-1].date === sell.date && (rot[i-1].signal === '买入' || rot[i-1].signal === '调仓')) {
      i--; // 这个sell实际不完整，跳过
      continue;
    }
    if (sell.signal.indexOf('卖出') < 0) {
      i--;
      continue;
    }
    // 找对应的买入（向前找最近的一个买入/调仓，且日期 <= 卖出日期）
    var buy = null;
    for (var j = i - 1; j >= 0; j--) {
      if (rot[j].signal === '买入' || rot[j].signal === '调仓') {
        buy = rot[j];
        break;
      }
    }
    if (!buy) {
      i--;
      continue;
    }
    // 计算持有天数（买→卖）
    var holdDays = 0;
    if (buy.date && sell.date) {
      var bd = new Date(buy.date);
      var sd = new Date(sell.date);
      holdDays = Math.round((sd - bd) / 86400000);
    }
    var pnl = sell.pnl_pct;
    var pnlDisplay = pnl != null ? fmtPct(pnl) : '-';
    var pnlClass = pnl != null ? (pnl >= 0 ? 'up' : 'down') : '';
    // 日期显示：去掉年份，格式 05-07
    var buyDateShort = buy.date ? buy.date.slice(5) : '-';
    var sellDateShort = sell.date ? sell.date.slice(5) : '-';
    var dateLabel = holdDays > 0 ? buyDateShort + ' → ' + sellDateShort + ' (' + holdDays + '天)' : buyDateShort + ' → ' + sellDateShort;
    cards.push({
      dateLabel: dateLabel,
      heldName: buy.name || '-',     // 这轮持有的（买入的）
      buyName: buy.name || '-',       // 买入时买的
      sellName: sell.name || '-',     // 卖出时卖的
      pnlDisplay: pnlDisplay,
      pnlClass: pnlClass,
      isSameDay: buy.date === sell.date,
      holdDays: holdDays
    });
    i = j - 1; // 跳过已配对的买入，继续往前找
  }

  // M25: 默认只展示最近 ROTATION_DEFAULT_LIMIT 条，点击"显示更多"后展开全部
  var visibleCards = rotationShowAll ? cards : cards.slice(0, ROTATION_DEFAULT_LIMIT);

  // 渲染：卡片只显示持仓，调仓动作插在卡片之间
  var rotHtml = '';
  for (var c = 0; c < visibleCards.length; c++) {
    var card = visibleCards[c];
    // 卡片：只显示持仓时间段 + 持有谁 + 收益
    rotHtml += '<div class="rot-card ' + card.pnlClass + '">' +
      '<div class="rot-card-date">' + card.dateLabel + '</div>' +
      '<div class="rot-card-held">' + card.heldName + '</div>' +
      '<div class="rot-card-pnl ' + card.pnlClass + '">' + card.pnlDisplay + '</div>' +
    '</div>';
    // 两卡之间：调仓动作（垂直方向，箭头上方标注卖出/买入）
    if (c < visibleCards.length - 1) {
      var nextCard = visibleCards[c + 1];
      rotHtml += '<div class="rot-adj">' +
        '<div class="rot-adj-label">' +
          '<span class="rot-adj-sell">卖出 ' + card.sellName + '</span>' +
          '&nbsp;→&nbsp;' +
          '<span class="rot-adj-buy">买入 ' + nextCard.buyName + '</span>' +
        '</div>' +
        '<div class="rot-adj-arrow-wrap">' +
          '<div class="rot-adj-arrow-line"></div>' +
          '<div class="rot-adj-arrow-head"></div>' +
        '</div>' +
      '</div>';
    }
  }
  if (!rotHtml) rotHtml = '<div class="empty-state">暂无轮动记录</div>';
  // M25: 未展开且卡片数超过默认上限时，显示"显示更多"按钮
  var moreBtn = '';
  if (!rotationShowAll && cards.length > ROTATION_DEFAULT_LIMIT) {
    moreBtn = '<div class="rot-show-more" data-action="showAllRotation">显示更多（共 ' + cards.length + ' 条，已显示 ' + visibleCards.length + ' 条）</div>';
  }
  document.getElementById('rotationArea').innerHTML = '<div class="rot-card-grid">' + rotHtml + '</div>' + moreBtn;
}
// M25: 点击"显示更多"展开全部轮动历史
function showAllRotation() {
  rotationShowAll = true;
  renderRotationHistory();
}

// ── 定时刷新 ──
var schedules = [];

async function loadSchedules() {
  var r = await fetch('/api/schedules');
  var d = await r.json();
  schedules = d.schedules || [];
  renderSchedules();
}

function renderSchedules() {
  var el = document.getElementById('schChips');
  if (!el) return;
  var html = '';
  schedules.forEach(function(s) {
    html += '<span class="sch-chip">' + escHtml(s.time) +
      ' <button class="sch-chip-del" data-id="' + escHtml(s.id) + '" data-action="delSchedule">✕</button></span>';
  });
  el.innerHTML = html;
}

async function addSchedule() {
  var inp = document.getElementById('schTimeInput');
  var t = inp.value.trim();
  if (!t) return;
  // 确认为 HH:MM 格式
  if (!/^\d{2}:\d{2}$/.test(t)) { showMsg('时间格式应为 HH:MM'); return; }
  var id = 'sch_' + t.replace(':', '') + '_' + Date.now();
  var updated = schedules.concat([{id: id, time: t, enabled: true}]);
  var r = await fetch('/api/schedules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({schedules: updated})
  });
  var d = await r.json();
  if (d.ok) {
    schedules = d.schedules;
    renderSchedules();
    inp.value = '';
  } else {
    showMsg(d.message || '添加失败');
  }
}

async function delSchedule(id) {
  var updated = schedules.filter(function(s) { return s.id !== id; });
  var r = await fetch('/api/schedules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({schedules: updated})
  });
  var d = await r.json();
  if (d.ok) {
    schedules = d.schedules;
    renderSchedules();
  }
}

async function runScheduleNow() {
  var r = await fetch('/api/schedules/run-now', {method: 'POST'});
  var d = await r.json();
  if (d.ok) {
    showMsg('刷新完成，新增 ' + d.new_count + ' 条数据');
    loadSchedules();
  } else {
    showMsg('刷新失败: ' + d.message);
  }
}

var schLogVisible = false;
async function toggleSchLog() {
  schLogVisible = !schLogVisible;
  var area = document.getElementById('schLogArea');
  if (!area) return;
  if (schLogVisible) {
    area.classList.add('show');
    var r = await fetch('/api/update-log?limit=20');
    var d = await r.json();
    var logs = d.logs || [];
    if (logs.length === 0) {
      area.innerHTML = '<div style="color:var(--text-dim)">暂无更新记录</div>';
    } else {
      var html = '';
      logs.forEach(function(l) {
        var cls = l.ok ? 'log-ok' : 'log-fail';
        var status = l.ok ? '✓' : '✗';
        var err = l.error ? ' (' + l.error + ')' : '';
        html += '<div class="log-item ' + cls + '">[' + l.time + '] ' + status + ' 新增' + l.new_count + '条' + err + '</div>';
      });
      area.innerHTML = html;
    }
  } else {
    area.classList.remove('show');
  }
}

// 启动
loadSchedules();
loadPortfolios();
